context.objects = [
    {
        factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "chat-coms-vst-sink"
            node.description = "Coms Processing Sink"
            media.class = Audio/Sink
            audio.position = [ FL FR ]
            # Desktop integration properties for user selection
            device.description = "Coms Processing Sink"
            device.class = "sound"
            device.icon-name = "audio-card"
            node.virtual = true
            # Monitor configuration optimized for VST routing
            monitor.channel-volumes = true
            monitor.passthrough = true
            adapter.auto-port-config = {
                mode = dsp
                monitor = true
                position = preserve
            }
        }
    }
]